name: YucehanRP Final Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pre-Build Cleanup & Fix
        run: |
          # Hata veren dil dosyalarını sil
          find app_pojavlauncher/src/main/res/ -type d -name "values-*" -exec rm -rf {} +
          # Hata veren ikon klasörünü sil
          rm -rf app_pojavlauncher/src/main/res/mipmap-anydpi-v26/
          # Eksik kütüphaneyi çek
          mkdir -p app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar -P app_pojavlauncher/libs/
          # Hata veren JRE indirme kısmını manuel klasör açarak kandırıyoruz
          mkdir -p app_pojavlauncher/src/main/assets/components/jre

      - name: Build APK (Bypass JRE)
        run: |
          chmod +x gradlew
          # JRE indirme hatasını geçmek için sadece APK derlemesine odaklanıyoruz
          ./gradlew assembleDebug -x lint -Pandroid.antypicalResourceChecking=true --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YucehanRP-Launcher
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
